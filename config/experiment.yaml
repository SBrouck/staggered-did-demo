seed: 20250920
n_units: 80
n_periods: 24
cohorts:
  - {size: 20, adopt_month: 10}
  - {size: 20, adopt_month: 12}
  - {size: 20, adopt_month: 14}
  - {size: 20, adopt_month: 16}
base_intercept: -3.5            # sets base outcome near 3 to 4 percent
